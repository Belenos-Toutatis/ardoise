[package]
name = "ardoise-sim"
description = "Simulated tablet and capture replay, behind the same transport interface as ardoise-ble."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-device = { path = "../ardoise-device" }
ardoise-proto = { path = "../ardoise-proto" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
thiserror = "2"

[dev-dependencies]
# The tablet service tests check the notes written in a library.
ardoise-core = { path = "../ardoise-core" }
# The tests of the private captures read their JSON lines.
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
