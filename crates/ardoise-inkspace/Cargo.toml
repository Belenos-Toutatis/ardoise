[package]
name = "ardoise-inkspace"
description = "Import of Wacom Inkspace notes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-core = { path = "../ardoise-core" }
ardoise-ink = { path = "../ardoise-ink" }
ardoise-render = { path = "../ardoise-render" }
png = "0.18"
# Without the default "fs" feature the crate has no disk environment at all: the database is
# only ever opened from memory, so it cannot write next to Inkspace's data.
rusty-leveldb = { version = "4.0.2", default-features = false }
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[features]
# `synthetic`: made-up Inkspace data written to disk, for tests and `--create-demo-inkspace`.
# The importer never uses it.
synthetic = []

[dev-dependencies]
# The integration tests build their fixtures with the `synthetic` module.
ardoise-inkspace = { path = ".", features = ["synthetic"] }
tempfile = "3"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
