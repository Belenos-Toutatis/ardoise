[package]
name = "ardoise-device"
description = "Tablet management: connection, sync, live mode and diagnostic log, over an abstract transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-core = { path = "../ardoise-core" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
