[package]
name = "ardoise-ble"
description = "Windows Bluetooth LE transport for the tablet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-device = { path = "../ardoise-device" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = "1"

[target.'cfg(windows)'.dependencies]
btleplug = "0.13.5"
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Radios",
    "Foundation",
    "Win32_System_WinRT",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
