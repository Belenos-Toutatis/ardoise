[package]
name = "ardoise-ble"
description = "Windows Bluetooth LE transport for the tablet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth",
    "Devices_Radios",
    "Foundation",
    "Win32_System_WinRT",
] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
