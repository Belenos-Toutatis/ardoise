[package]
name = "ardoise-core"
description = "Notes, .ardoise file format, library, portable settings and note operations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-ink = { path = "../ardoise-ink" }
# Text frames: their fonts and layout, to measure a frame's box (page objects).
ardoise-text = { path = "../ardoise-text" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
