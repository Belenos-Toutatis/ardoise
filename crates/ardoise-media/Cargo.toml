[package]
name = "ardoise-media"
description = "Replay frames, MP4/GIF/WebP/WebM export, microphone capture and audio encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["asm"]
# rav1e's x86-64 assembly: AV1 (WebM) several times faster. Needs `nasm` 2.15 or later on the
# build machine (never on the user's PC): found through the `NASM` variable, which
# `cargo xtask` sets from `%LOCALAPPDATA%\ArdoiseDev\nasm-*`, or on `PATH`. Without nasm the build
# stops with rav1e's "NASM build failed" message; `--no-default-features` builds a slow AV1.
asm = ["rav1e/asm"]

[dependencies]
# The replay: notes, strokes and their drawing (the same as every other export).
ardoise-core = { path = "../ardoise-core" }
ardoise-ink = { path = "../ardoise-ink" }
ardoise-render = { path = "../ardoise-render" }
thiserror = "2"
# Microphone capture (WASAPI on Windows) and resampling to the 48 kHz narration rate.
cpal = "0.18"
rubato = "5"
# GIF: pure Rust (image-rs). Its default `color_quant` feature brings the NeuQuant quantiser,
# used directly by `gif.rs` when a frame has more than 255 colours.
gif = "0.14"
color_quant = "1.1"
# Animated WebP: libwebp's WebPAnimEncoder, built from source with `cc` (no cmake).
webp-animation = "0.10"
# WebM: AV1 by rav1e (pure Rust + optional assembly), Matroska muxing by libwebm (C++, `cc`).
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
webm = "2.2"
# Opus (narration in WebM, and in MP4 through the OpenH264 fallback): pure-Rust port of libopus.
ropus = "0.12"
# Reads WebM files back for `probe_webm` (pure Rust, no dependencies).
matroska-demuxer = "0.8"
# MP4 through the OpenH264 fallback (`mp4.rs`, `openh264/`): the container is written by
# Shiguredo's sans-I/O muxer (pure Rust, no dependencies; samples stream to the file), and the
# files of both back ends are read back by Mozilla's `mp4parse` (Firefox's parser: independent
# of either writer). The Cisco download is decompressed by `bzip2-rs` (pure-Rust decoder) and
# checked with `sha2` (the same version `openh264` uses).
shiguredo_mp4 = "2026.5"
mp4parse = "0.17"
bzip2-rs = "0.1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Same version as `ardoise-ble`, so only one copy of the crate is compiled.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # PROPVARIANT, for the container duration read by `probe_mp4`.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # LoadLibraryExW: is Media Foundation there (Windows N editions) before calling it?
    "Win32_System_LibraryLoader",
] }
# OpenH264 2.6.0 loaded at run time from the DLL the user downloaded from Cisco (never built
# from source or bundled: Cisco's patent licence covers only its own binary).
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
# The HTTPS download from Cisco, through Windows' own TLS (SChannel) and certificate store.
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
# `tests/revise_replay.rs`: the time orders of the revisions against the real replay.
ardoise-revise = { path = "../ardoise-revise" }
# Text frames in the replay tests (their font family).
ardoise-text = { path = "../ardoise-text" }
tempfile = "3"

[lints]
workspace = true
