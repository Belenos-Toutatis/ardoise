[package]
name = "ardoise-revise"
description = "Orders that retouch a copy of a note's strokes, without any I/O, and the written lines found from the ink."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-ink = { path = "../ardoise-ink" }
# The JSON schema of the orders: the doc comments of `orders.rs` become what an assistant reads.
schemars = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# `tests/real_notes.rs`: the notes in `testdata/private/revise/`, when they are there, and a
# picture of the result when `ARDOISE_SAMPLES_DIR` is set.
ardoise-core = { path = "../ardoise-core" }
ardoise-render = { path = "../ardoise-render" }
serde_json = "1"

[lints]
workspace = true
