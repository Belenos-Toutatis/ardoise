[package]
name = "ardoise-hwr"
description = "Offline handwriting recognition through Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Notes (visible layers) and strokes.
ardoise-core = { path = "../ardoise-core" }
ardoise-ink = { path = "../ardoise-ink" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Accent-blind comparison of words (the reference test, the search of the app).
unicode-normalization = "0.1"
# The Word document (`docx.rs`): a ZIP of XML parts, written with the crate the note format uses.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# `Windows.UI.Input.Inking` (InkRecognizerContainer, InkStrokeBuilder); the same version as
# `ardoise-ble` and `ardoise-media`, so only one copy of the crate is compiled. The collections
# and numerics crates are the ones `windows` itself uses (it does not re-export them).
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "UI_Input_Inking",
    "UI_Input_Inking_Analysis",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
] }
windows-collections = "0.3"
windows-numerics = "0.3"

[dev-dependencies]
serde_json = "1"
# Reads the Word document back in tests.
roxmltree = "0.21"

# The measurement of where the engine works (`tests/engine_threads.rs`): threads of the process.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[lints]
workspace = true
