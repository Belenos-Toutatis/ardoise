[package]
name = "ardoise-render"
description = "Raster rendering of notes: ink tools, page backgrounds, templates and textures; PNG export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-core = { path = "../ardoise-core" }
ardoise-ink = { path = "../ardoise-ink" }
png = "0.18"
thiserror = "2"
# PNG files go through the `png` crate directly (the version already in the workspace).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
