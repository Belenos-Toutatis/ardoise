[package]
name = "ardoise-render"
description = "Rendering and export of notes: ink tools, page backgrounds, templates, textures and background images; PNG, JPG, SVG, PDF and clipboard images."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ardoise-core = { path = "../ardoise-core" }
ardoise-ink = { path = "../ardoise-ink" }
# Text frames: their layout and glyph outlines, the very ones the editor draws.
ardoise-text = { path = "../ardoise-text" }
# Background images: decodes the JPEG photos users import (pure Rust; no thread pool).
jpeg-decoder = { version = "0.3", default-features = false }
# Lossless WebP files: libwebp's encoder, built from source with `cc` (`ardoise-media` already builds
# it for animated WebP, through `webp-animation`). The pure-Rust encoder of `image-webp` was
# measured and gives files larger than the PNG.
libwebp-sys2 = "0.2"
# zlib streams of the PDF writer (the version the `png` crate already uses).
miniz_oxide = "0.8"
pdf-writer = "0.15"
png = "0.18"
thiserror = "2"
# PNG files go through the `png` crate directly (the version already in the workspace).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
# Reads the WebP files back in tests (an independent decoder).
image-webp = "0.2"
# Independent readers, used only to validate the exports in tests.
lopdf = { version = "0.46", default-features = false }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
roxmltree = "0.21"

[lints]
workspace = true
