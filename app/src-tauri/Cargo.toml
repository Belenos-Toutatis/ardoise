[package]
name = "ardoise"
description = "Ardoise: portable companion app for the Wacom Bamboo Slate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ardoise_app"
path = "src/lib.rs"

[[bin]]
name = "ardoise"
path = "src/main.rs"

[features]
# Embeds the built interface in the executable. Without it Tauri makes a development build
# that loads the interface from the dev server (http://localhost:1420).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ardoise-core = { path = "../../crates/ardoise-core" }
ardoise-ble = { path = "../../crates/ardoise-ble" }
ardoise-device = { path = "../../crates/ardoise-device" }
ardoise-ink = { path = "../../crates/ardoise-ink" }
ardoise-inkspace = { path = "../../crates/ardoise-inkspace" }
ardoise-render = { path = "../../crates/ardoise-render" }
ardoise-sim = { path = "../../crates/ardoise-sim" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
