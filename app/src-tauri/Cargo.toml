[package]
name = "ardoise"
description = "Ardoise: portable companion app for the Wacom Bamboo Slate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ardoise_app"
path = "src/lib.rs"

[[bin]]
name = "ardoise"
path = "src/main.rs"

[features]
# Embeds the built interface in the executable. Without it Tauri makes a development build
# that loads the interface from the dev server (http://localhost:1420).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
ardoise-core = { path = "../../crates/ardoise-core" }
ardoise-ble = { path = "../../crates/ardoise-ble" }
ardoise-device = { path = "../../crates/ardoise-device" }
ardoise-hwr = { path = "../../crates/ardoise-hwr" }
ardoise-ink = { path = "../../crates/ardoise-ink" }
# `synthetic`: made-up Inkspace data for `--create-demo-inkspace` (never used by the import).
ardoise-inkspace = { path = "../../crates/ardoise-inkspace", features = ["synthetic"] }
ardoise-mcp = { path = "../../crates/ardoise-mcp" }
ardoise-media = { path = "../../crates/ardoise-media" }
ardoise-proto = { path = "../../crates/ardoise-proto" }
ardoise-render = { path = "../../crates/ardoise-render" }
ardoise-sim = { path = "../../crates/ardoise-sim" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
# The runtime of `--mcp` mode only (current-thread, built in `mcp.rs`).
tokio = { version = "1", default-features = false, features = ["rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# Console: attach to the parent console. DataExchange, Memory, Ole: the clipboard (clipboard.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
# Same version as `ardoise-ble` and `ardoise-media`: one copy compiled.
# - Data_Pdf, Foundation, Storage_Streams: PDF pages rendered by Windows for background images
#   (pdf_pages.rs), read from and rendered into in-memory streams.
# - Win32_*: the drag of notes out of the app to other programs (drag_windows.rs), OLE drag and
#   drop and the shell's data object; printing (print_windows.rs): the print dialog
#   (Controls_Dialogs), GDI documents (Storage_Xps) and the printers' default settings (Printing).
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# The `implement` macro of the `windows` crate expands to paths through this crate's name.
windows-core = "0.62"

[lints]
workspace = true

[dev-dependencies]
# Reads the exported PDFs back in tests.
lopdf = { version = "0.46", default-features = false }
tempfile = "3"
