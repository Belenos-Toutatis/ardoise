[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri", "xtask"]
default-members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Drawing code is hot (exports, thumbnails, video frames): optimise it for speed even though
# the rest of the release build favours size.
[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.ardoise-ink]
opt-level = 3

[profile.release.package.ardoise-render]
opt-level = 3

# Video encoding: rav1e is generic over the pixel type, so most of the AV1 encoder is compiled
# inside ardoise-media; at the size-oriented level a WebM export would be several times slower.
[profile.release.package.ardoise-media]
opt-level = 3

[profile.release.package.rav1e]
opt-level = 3

[profile.dev.package.ardoise-media]
opt-level = 3

[profile.dev.package.rav1e]
opt-level = 3

# Keeps the rendering tests fast in debug builds.
[profile.dev.package.tiny-skia]
opt-level = 2
